services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - stocksense_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stocksense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles: ["full"]

volumes:
  stocksense_pg:
