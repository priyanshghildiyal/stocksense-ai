name: StockSense CI

on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stocksense-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma client
        run: npm run prisma:generate -w backend

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Frontend build
        run: npm run build -w Frontend

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
